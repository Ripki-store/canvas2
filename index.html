<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor Layout Canvas</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eaf0;--pn:#fff;--ink:#161a26;--mu:#667085;--ac:#2f4bd6;--on:#fff;--ln:#d5d9e4;--fi:#f3f4f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--pn:#1a1d27;--ink:#e9ecf5;--mu:#98a0b5;--ac:#8ea2ff;--on:#0e1330;--ln:#2d3243;--fi:#12141c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--pn:#1a1d27;--ink:#e9ecf5;--mu:#98a0b5;--ac:#8ea2ff;--on:#0e1330;--ln:#2d3243;--fi:#12141c;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 'Schibsted Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font-size:16px;margin:0;flex:1;font-weight:700;white-space:nowrap}
button{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:232px 1fr 292px}
aside{background:var(--pn);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
#L{border-right:1px solid var(--ln)}#R{border-left:1px solid var(--ln)}
h2{font-size:13px;margin:0 0 6px;font-weight:700}
#stage{display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;min-width:0;min-height:0}#mid{display:flex;flex-direction:column;min-width:0;min-height:0}#stage{flex:1;align-items:flex-start;justify-content:flex-start}#cv{margin:auto}#tb .ck{padding:0;align-self:center}.ly .t{margin-left:auto;display:flex;gap:2px}.ly .t span{cursor:pointer;padding:0 4px}.sw{width:26px;height:26px;min-height:0!important;padding:0;border-radius:50%}.pi{display:flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:6px 8px;margin-bottom:5px}.pi b{flex:1;min-width:0;overflow-wrap:anywhere}.pi small{display:block;color:var(--mu);font-weight:400}#tb{display:flex;gap:6px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap;align-items:center}#tb .sp{flex:1}#hint{margin:0;padding:6px 12px;font-size:12px;color:var(--mu);background:var(--pn);border-top:1px solid var(--ln)}
#cv{display:block;background:#fff;box-shadow:0 4px 22px #0003;touch-action:none;cursor:default;flex:none}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--fi);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input[type=color]{padding:2px;height:34px}input[type=checkbox]{width:auto}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);align-self:end;padding-bottom:7px}
.row{display:flex;gap:6px;flex-wrap:wrap}.mu{color:var(--mu);margin:0}
.ly{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;cursor:pointer}
.ly.on{border-color:var(--ac);background:var(--fi)}.ly i{font-style:normal;width:18px;text-align:center;color:var(--mu)}.ly b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
#dlg{position:fixed;inset:0;background:#000a;display:none;z-index:9;padding:16px}#dlg.on{display:flex}
.card{margin:auto;width:min(820px,100%);height:min(90%,720px);background:var(--pn);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
#code{flex:1;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2;resize:none}
@media(max-width:900px){body{overflow:auto}main{display:flex;flex-direction:column;flex:none}#mid{order:-1;position:sticky;top:0;z-index:3;height:60vh;flex:none;background:var(--bg)}#hint{display:none}#R{order:0;border:0;border-top:1px solid var(--ln)}#L{order:1;border:0;border-top:1px solid var(--ln)}input,select,textarea{font-size:16px}}@media(pointer:coarse){button{min-height:42px}}
</style></head><body>
<header><h1>Editor Layout Canvas</h1><button id="pv0">Preview</button><button id="iJ">Import JSON</button><button id="eJ">Export JSON</button><button id="eC" class="pri">Export Node.js Code</button></header>
<main>
<aside id="L">

 <section><h2>Kanvas</h2><div class="g"><label>Lebar (px)<input id="cw" type="number" min="1"></label><label>Tinggi (px)<input id="ch" type="number" min="1"></label>
 <label class="full">Warna latar<input id="bgc" type="color" value="#ffffff"></label><label class="full">Preset ukuran<select id="pre"><option value="">Pilih preset…</option><option value="2000x1414">Sertifikat 2000×1414</option><option value="3508x2480">A4 landscape 3508×2480</option><option value="2480x3508">A4 portrait 2480×3508</option><option value="1920x1080">1920×1080</option><option value="1080x1080">1080×1080</option><option value="1080x1920">1080×1920</option></select></label><div class="full row"><button id="bgb">Upload background</button><button id="bgx">Hapus</button></div><p class="mu full" id="bgn"></p></div></section>
 <section><h2>Preset</h2><div class="g"><input id="pn" class="full" placeholder="Nama preset, mis. sertifikat-a"><div class="full row"><button id="ps" class="pri">Simpan preset</button><button id="pa">Export pack</button><button id="pg">Panduan API</button></div><label class="ck full" style="padding:0"><input id="pbg" type="checkbox">Sertakan background di pack</label><div id="pl" class="full"></div></div></section>
 <section><h2>Layer</h2><div id="ly"></div></section>
</aside>
<div id="mid"><div id="tb"><button data-add="text" class="pri">+ Teks</button><button data-add="rect">+ Gambar kotak</button><button data-add="ellipse">+ Gambar lingkaran</button><select id="ash" style="width:auto"><option value="">+ Bentuk</option><option value="rect">Persegi</option><option value="ellipse">Lingkaran</option><option value="tri">Segitiga</option><option value="star">Bintang</option></select><span class="sp"></span><label class="ck"><input id="sn" type="checkbox" checked>Snap</label><label class="ck"><input id="gr" type="checkbox">Grid</label><button id="zo" title="Perkecil">−</button><button id="zf" title="Pas layar">Pas</button><button id="zi" title="Perbesar">+</button><button id="un" title="Urungkan (Ctrl+Z)">↶ Urungkan</button><button id="re" title="Ulangi (Ctrl+Y)">↷ Ulangi</button></div><div id="stage"><canvas id="cv"></canvas></div><p id="hint">Klik objek untuk memilih, lalu seret untuk menggeser. Klik dua kali pada teks untuk mengedit isinya. Tombol panah menggeser 1 px (dengan Shift 10 px).</p></div>
<aside id="R"><h2>Properti</h2><div id="pp"></div></aside>
</main>
<input type="file" id="file" accept="image/*" hidden>
<datalist id="fonts"><option>Arial</option><option>Helvetica</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option>Courier New</option><option>Impact</option><option>sans-serif</option><option>serif</option></datalist>
<div id="dlg"><div class="card"><div class="row" style="align-items:center"><b id="dt" style="flex:1"></b><button id="ap" class="pri" hidden>Terapkan</button><button id="cp" class="pri">Salin</button><button id="cl">Tutup</button></div><textarea id="code" readonly spellcheck="false"></textarea><img id="pv" hidden alt="Preview" style="flex:1;min-height:0;object-fit:contain;background:#fff"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const S={W:2000,H:1414,bg:null,els:[],sel:null,n:0};
const cv=$('#cv'),c=cv.getContext('2d'),mc=document.createElement('canvas').getContext('2d');
let drag=null,upT=null;const HS=matchMedia('(pointer:coarse)').matches?18:10;let ZM=1,GA=0,NOOV=0;S.bgc='#ffffff';const SN=()=>$('#sn').checked?6:-1;
let HIST=[],hi=-1;
const cl=()=>({W:S.W,H:S.H,els:S.els.map(e=>({...e}))});
function commit(){const s=cl(),j=JSON.stringify(s);if(hi>=0&&HIST[hi].j===j)return;HIST=HIST.slice(0,hi+1);HIST.push({s,j});if(HIST.length>100)HIST.shift();hi=HIST.length-1}
function go(d){const i=hi+d;if(i<0||i>=HIST.length)return;hi=i;const s=HIST[i].s;S.W=s.W;S.H=s.H;S.els=s.els.map(e=>({...e}));if(!sel())S.sel=null;$('#cw').value=S.W;$('#ch').value=S.H;fit();panel();layers();draw()}
const fam=f=>/\s/.test(f)&&!/^["']/.test(f)?`"${f}"`:f,fnt=e=>`${e.italic?'italic ':''}${e.bold?'bold ':''}${e.size}px ${fam(e.family)}`;
const lhOf=e=>e.lh||Math.round(e.size*1.2),lines=e=>String(e.content).split('\n'),sel=()=>S.els.find(e=>e.id===S.sel);
function box(e){if(e.type!=='text')return{w:e.width,h:e.height};mc.font=fnt(e);const L=lines(e);return{w:Math.max(...L.map(l=>mc.measureText(l).width)),h:L.length*lhOf(e)}}
function uniq(b){let i=1,n=b;while(S.els.some(e=>e.name===n))n=b+(++i);return n}

/* ===== Render (dipakai editor; urutan & API sama dengan kode export) ===== */
function draw(){
 if(cv.width!==S.W)cv.width=S.W;if(cv.height!==S.H)cv.height=S.H;
 c.clearRect(0,0,S.W,S.H);c.fillStyle=S.bgc||'#ffffff';c.fillRect(0,0,S.W,S.H);
 if(S.bg)c.drawImage(S.bg.img,0,0,S.W,S.H);
 for(const e of S.els){
  if(e.hide)continue;c.globalAlpha=(e.op??100)/100;if(e.type==='shape')drawShape(c,e);else if(e.type==='text'){c.textAlign='left';c.textBaseline='top';c.font=fnt(e);c.fillStyle=e.color;const lh=lhOf(e);if(e.blur||e.shx||e.shy){c.shadowColor=e.shc||'rgba(0,0,0,0.5)';c.shadowBlur=e.blur||0;c.shadowOffsetX=e.shx||0;c.shadowOffsetY=e.shy||0}lines(e).forEach((l,i)=>{const yy=e.y+i*lh;if(e.stw){c.strokeStyle=e.stc||'#000000';c.lineWidth=e.stw;c.lineJoin='round';c.strokeText(l,e.x,yy)}c.fillText(l,e.x,yy)});c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetX=0;c.shadowOffsetY=0}
  else{c.save();if(e.shape==='ellipse'){c.beginPath();c.ellipse(e.x+e.width/2,e.y+e.height/2,e.width/2,e.height/2,0,0,Math.PI*2);c.clip()}else if(e.radius){trace(c,e);c.clip()}if(e.flipH||e.flipV){c.translate(e.x+(e.flipH?e.width:0),e.y+(e.flipV?e.height:0));c.scale(e.flipH?-1:1,e.flipV?-1:1);c.translate(-e.x,-e.y)}
   if(e.img)c.drawImage(e.img,e.x,e.y,e.width,e.height);else{c.fillStyle='#c5cce0';c.fillRect(e.x,e.y,e.width,e.height)}c.restore();if(e.bw)border(c,e)}}
 overlay()}
function overlay(){c.globalAlpha=1;if(NOOV)return;const e=sel(),k=S.W/cv.getBoundingClientRect().width||1;if($('#gr').checked){c.save();c.lineWidth=k;c.strokeStyle='#8a93ad66';c.beginPath();for(let x=100;x<S.W;x+=100){c.moveTo(x,0);c.lineTo(x,S.H)}for(let y=100;y<S.H;y+=100){c.moveTo(0,y);c.lineTo(S.W,y)}c.stroke();c.restore()}if(!e)return;const b=box(e),ac='#2f4bd6';
 c.save();c.lineWidth=1.5*k;c.strokeStyle=ac;c.strokeRect(e.x,e.y,b.w,b.h);
 if(e.type!=='text'){const h=HS*k;c.fillStyle='#fff';c.fillRect(e.x+b.w-h/2,e.y+b.h-h/2,h,h);c.strokeRect(e.x+b.w-h/2,e.y+b.h-h/2,h,h)}
 if(drag){c.setLineDash([6*k,5*k]);c.strokeStyle='#12a8a8';c.beginPath();c.moveTo(S.W/2,0);c.lineTo(S.W/2,S.H);c.moveTo(0,S.H/2);c.lineTo(S.W,S.H/2);c.stroke();
  c.strokeStyle='#e5367a';c.beginPath();for(const x of[e.x,e.x+b.w/2,e.x+b.w]){c.moveTo(x,0);c.lineTo(x,S.H)}for(const y of[e.y,e.y+b.h/2,e.y+b.h]){c.moveTo(0,y);c.lineTo(S.W,y)}c.stroke();
  c.setLineDash([]);c.fillStyle='#e5367a';c.font=`${13*k}px sans-serif`;c.textBaseline='bottom';c.fillText(`x ${e.x}  y ${e.y}`,e.x,Math.max(e.y-5*k,16*k))}
 c.restore()}
function fit(){const s=$('#stage'),z=Math.min((s.clientWidth-32)/S.W,(s.clientHeight-32)/S.H);const Z=z*ZM;cv.style.width=Math.max(60,S.W*Z)+'px';cv.style.height=Math.max(60,S.H*Z)+'px';$('#zf').textContent=Math.round(Z*100)+'%'}

/* ===== Drag & drop (koordinat kiri-atas, bulat) ===== */
const pos=ev=>{const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*S.W/r.width,y:(ev.clientY-r.top)*S.H/r.height}};
function snap(v,w,T,t){let b=null;for(const o of[0,w/2,w])for(const g of T){const d=g-(v+o);if(Math.abs(d)<=t&&(b===null||Math.abs(d)<Math.abs(b)))b=d}return b===null?v:Math.round(v+b)}
cv.onpointerdown=ev=>{const p=pos(ev),k=S.W/cv.getBoundingClientRect().width,s=sel();
 if(s&&s.type!=='text'&&Math.abs(p.x-(s.x+s.width))<HS*k&&Math.abs(p.y-(s.y+s.height))<HS*k)drag={m:'rs'};
 else{let h=null;for(let i=S.els.length-1;i>=0;i--){const e=S.els[i],b=box(e);if(!e.hide&&p.x>=e.x&&p.x<=e.x+b.w&&p.y>=e.y&&p.y<=e.y+b.h){h=e;break}}
  select(h?h.id:null);if(!h||h.lock)return;drag={m:'mv',dx:p.x-h.x,dy:p.y-h.y}}
 cv.setPointerCapture(ev.pointerId);draw()};
cv.onpointermove=ev=>{if(!drag)return;const e=sel(),p=pos(ev),k=S.W/cv.getBoundingClientRect().width;
 if(drag.m==='rs'){let w=Math.max(10,Math.round(p.x-e.x)),h=Math.max(10,Math.round(p.y-e.y));if(ev.shiftKey&&e.img)h=Math.round(w*e.img.naturalHeight/e.img.naturalWidth);e.width=w;e.height=h}
 else{const b=box(e);e.x=snap(Math.round(p.x-drag.dx),b.w,[0,S.W/2,S.W],SN()*k);e.y=snap(Math.round(p.y-drag.dy),b.h,[0,S.H/2,S.H],SN()*k)}
 sync();draw()};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;commit();draw()};cv.ondblclick=()=>{const t=$('#pp [data-k="content"]');if(t){t.focus();t.select()}};

/* ===== Panel properti ===== */
const N=(l,k,v)=>`<label>${l}<input data-k="${k}" type="number" value="${v}"></label>`;
function panel(){const e=sel(),p=$('#pp');if(!e){p.innerHTML='<p class="mu">Pilih objek di kanvas atau di daftar layer untuk mengubah propertinya.</p>';return}
 let h=`<div class="g"><label class="full">Nama (dipakai di JSON & kode)<input data-k="name" value="${esc(e.name)}"></label>`;
 if(e.type==='text')h+=`<label class="full">Teks<textarea data-k="content" rows="2">${esc(e.content)}</textarea></label>${N('X','x',e.x)}${N('Y','y',e.y)}
  <label class="full">Font<input data-k="family" list="fonts" value="${esc(e.family)}"></label>${N('Ukuran (px)','size',e.size)}<label class="ck"><input data-k="bold" type="checkbox" ${e.bold?'checked':''}>Tebal</label><label class="ck"><input data-k="italic" type="checkbox" ${e.italic?'checked':''}>Miring</label>${N('Jarak baris (px)','lh',lhOf(e))}
  <label class="full">Warna<input data-k="color" type="color" value="${e.color}"></label>${sw('color')}${N('Outline (px)','stw',e.stw||0)}<label>Warna outline<input data-k="stc" type="color" value="${e.stc||'#000000'}"></label>${N('Blur bayangan','blur',e.blur||0)}<label>Warna bayangan<input data-k="shc" type="color" value="${e.shc||'#000000'}"></label>${N('Bayangan X','shx',e.shx||0)}${N('Bayangan Y','shy',e.shy||0)}<div class="full row"><button data-act="AA">HURUF BESAR</button><button data-act="aa">huruf kecil</button></div>`;
 else h+=`${N('X','x',e.x)}${N('Y','y',e.y)}${N('Lebar','width',e.width)}${N('Tinggi','height',e.height)}
  <label class="full">Bentuk<select data-k="shape"><option value="rect" ${e.shape==='rect'?'selected':''}>Kotak</option><option value="ellipse" ${e.shape==='ellipse'?'selected':''}>Lingkaran / ellipse</option>${e.type==='shape'?['tri','star'].map(v=>`<option value="${v}" ${e.shape===v?'selected':''}>${{tri:'Segitiga',star:'Bintang'}[v]}</option>`).join(''):''}</select></label>
  ${e.type==='shape'?SHP(e):IMG(e)}<p class="mu full">Tarik titik di pojok kanan-bawah untuk mengubah ukuran (Shift = rasio asli).</p>`;
 h+=`<div class="full row"><button data-act="cx">Tengahkan horizontal</button><button data-act="cy">Tengahkan vertikal</button></div><div class="full row"><button data-act="aL">Ke kiri</button><button data-act="aR">Ke kanan</button><button data-act="aT">Ke atas</button><button data-act="aB">Ke bawah</button></div>
  ${N('Opasitas (%)','op',e.op??100)}<p class="mu full" id="meas"></p><div class="full row"><button data-act="up">Naik</button><button data-act="dn">Turun</button><button data-act="top">Paling depan</button><button data-act="bot">Paling belakang</button><button data-act="dup">Duplikat</button><button data-act="del">Hapus</button></div></div>`;
 p.innerHTML=h;sync()}
function sync(){const e=sel();if(!e)return;for(const k of['x','y','width','height']){const i=$(`#pp [data-k="${k}"]`);if(i&&document.activeElement!==i)i.value=e[k]}
 const m=$('#meas'),b=box(e);if(m)m.textContent=`Kotak objek: ${Math.round(b.w)} × ${Math.round(b.h)} px`}
$('#pp').addEventListener('input',ev=>{const t=ev.target,k=t.dataset.k,e=sel();if(!k||!e)return;let v;
 if(t.type==='checkbox')v=t.checked;else if(t.type==='number'){v=Math.round(+t.value||0);if(['size','width','height','lh'].includes(k))v=Math.max(1,v);if(k==='op')v=Math.min(100,Math.max(0,v));if(['radius','bw','sw','blur','stw'].includes(k))v=Math.max(0,v)}
 else if(k==='name'){v=t.value.replace(/\W/g,'_');if(v!==t.value)t.value=v;if(!v)return}else v=t.value;
 e[k]=v;if(k==='name')layers();sync();draw()});
$('#pp').addEventListener('change',()=>commit());
$('#pp').addEventListener('click',ev=>{const a=ev.target.dataset.act,e=sel();if(!a||!e)return;const i=S.els.indexOf(e);
 if(a==='cx'){e.x=Math.round(S.W/2-box(e).w/2)}
 else if(a==='cy'){e.y=Math.round(S.H/2-box(e).h/2)}
 else if(a==='fh')e.flipH=!e.flipH;else if(a==='fv')e.flipV=!e.flipV;else if(a==='fit'){e.x=0;e.y=0;e.width=S.W;e.height=S.H}else if(a==='nat'){if(e.img){e.width=e.img.naturalWidth;e.height=e.img.naturalHeight}}else if(a==='AA'){e.content=e.content.toUpperCase();panel()}else if(a==='aa'){e.content=e.content.toLowerCase();panel()}else if(a==='top')S.els.push(S.els.splice(i,1)[0]);else if(a==='bot')S.els.unshift(S.els.splice(i,1)[0]);else if(a==='aL')e.x=0;else if(a==='aR')e.x=Math.round(S.W-box(e).w);else if(a==='aT')e.y=0;else if(a==='aB')e.y=Math.round(S.H-box(e).h);
 else if(a==='up'&&i<S.els.length-1)S.els.splice(i+1,0,S.els.splice(i,1)[0]);
 else if(a==='dn'&&i>0)S.els.splice(i-1,0,S.els.splice(i,1)[0]);
 else if(a==='dup'){const d={...e,id:++S.n,name:uniq(e.name.replace(/\d+$/,'')||'obj'),x:e.x+20,y:e.y+20};S.els.push(d);S.sel=d.id;panel()}
 else if(a==='del'){S.els.splice(i,1);S.sel=null;panel()}
 else if(a==='img'){upT=e.id;$('#file').click()}
 if(a!=='img')commit();
